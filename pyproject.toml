[project]
name = "dumprx"
version = "0.1.0"
description = "Android firmware dumper - extract, parse, and publish partition dumps"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.2,<9",
    "jinja2>=3.1,<4",
    "loguru>=0.7",
    "rich>=13.0",
    "rich-click>=1.8",
    "sebaubuntu-libs>=1.3,<2",
]

[project.scripts]
dumprx = "dumprx.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = ["dumprx", "twrpdtgen"]

[tool.ruff]
line-length = 100
target-version = "py313"
lint.select = ["E", "F", "I", "W"]
lint.ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/twrpdtgen/**" = ["E101", "W191", "W292"]

[tool.pytest.ini_options]
testpaths = ["tests"]
